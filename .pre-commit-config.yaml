# Pre-commit hooks for gale-shapley-algorithm
# Install: uvx pre-commit install
# Run all: uvx pre-commit run --all-files
# The hooks call the taskipy tasks so they use the same pinned ruff as CI (`ruff` in pyproject.toml).

repos:
  - repo: local
    hooks:
      # Auto-format code on commit
      - id: format
        name: ruff format
        entry: uvx --from taskipy task format
        language: system
        types: [python]
        pass_filenames: false

      # Lint and auto-fix on commit
      - id: lint
        name: ruff check
        entry: uvx --from taskipy task lint
        language: system
        types: [python]
        pass_filenames: false
