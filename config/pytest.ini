[pytest]
testpaths = tests
python_files = *_test.py test_*.py
addopts = --cov=src/gale_shapley_algorithm --cov-report=term-missing --cov-config=config/coverage.ini -vv
# starlette < 1.7 (allowed by fastapi>=0.115) builds its TestClient on an anyio
# alias that anyio >= 4.15 deprecates; only the test client is affected.
filterwarnings =
    error
    default::EncodingWarning
    error::EncodingWarning:gale_shapley_algorithm
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
