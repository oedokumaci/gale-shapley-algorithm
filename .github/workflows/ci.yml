name: ci

on:
  push:
    branches:
    - main
    - test-me-*
  pull_request:
    branches:
    - main
  # Weekly run so new upstream releases that break main (e.g. a deprecation that
  # pytest turns into an error under test-min-deps) surface before the next PR.
  schedule:
  - cron: "17 6 * * 1"
  workflow_dispatch:
  # Called by the publish and docker workflows so a release only ships if CI passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra cli --extra gui --extra numeric

    - name: Check code formatting
      run: uvx --from taskipy task format_check

    - name: Check code quality (lint)
      run: uvx --from taskipy task lint_check

    - name: Check types
      run: uvx --from taskipy task typecheck

    - name: Build documentation
      run: uvx --from taskipy task docs_build

  test:
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra cli --extra gui --extra numeric --python ${{ matrix.python-version }}

    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} pytest -c config/pytest.ini

  test-min-deps:
    # Verify the declared lower bounds on optional-extra dependencies actually work.
    # uv's lowest-direct resolution pins each declared dep to its minimum version.
    needs: quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    # No --locked here: lowest-direct deliberately re-resolves away from uv.lock.
    - name: Install dependencies (lowest-direct resolution)
      run: uv sync --extra cli --extra gui --extra numeric --resolution lowest-direct

    # --no-sync: a plain `uv run` sees the lockfile's lowest-direct resolution mode,
    # re-locks at the highest versions and upgrades the test group, so the declared
    # minimums would never be the ones under test.
    - name: Run tests
      run: uv run --no-sync pytest -c config/pytest.ini

  package:
    # Build the distributions a release would upload and use them from a clean environment, so a
    # file missing from the sdist or wheel fails here rather than after it reaches PyPI.
    needs: quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - name: Build sdist and wheel
      run: uv build

    # PyPI rejects a version it already has, while the docker workflow would still push the release
    # tag, so the tag, the built version (__version__) and CITATION.cff must all agree.
    - name: Check the version against CITATION.cff and the release tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        wheel="$(basename dist/*.whl)"
        version="${wheel#gale_shapley_algorithm-}"
        version="${version%%-*}"
        citation="$(sed -nE 's/^version: *"?([^"]+)"?$/\1/p' CITATION.cff)"
        echo "package $version, CITATION.cff $citation, release tag ${RELEASE_TAG:-none}"
        if [ "$citation" != "$version" ]; then
          echo "::error file=CITATION.cff::version is $citation but the package version is $version"
          exit 1
        fi
        if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
          echo "::error::release tag $RELEASE_TAG does not match the package version $version"
          exit 1
        fi

    # --no-cache: the wheel's file URL is the same from run to run, and uv would otherwise reuse a
    # previously unpacked copy from the restored cache instead of the wheel built above.
    - name: Import every module from the wheel in an isolated environment
      run: |
        wheel="$(echo dist/*.whl)"
        uv run --no-cache --isolated --no-project --with "gale-shapley-algorithm[cli,gui,numeric] @ file://$PWD/$wheel" python - <<'EOF'
        import importlib.resources

        import gale_shapley_algorithm as gsa
        import gale_shapley_algorithm._api.app
        import gale_shapley_algorithm._cli.app
        import gale_shapley_algorithm.numeric

        assert "site-packages" in gsa.__file__, gsa.__file__
        assert importlib.resources.files("gale_shapley_algorithm").joinpath("py.typed").is_file()
        assert gsa.create_matching({"a": ["b"]}, {"b": ["a"]}).matches == {"a": "b"}
        EOF

    - name: Run the test suite from the unpacked sdist
      run: |
        mkdir sdist-check
        tar -xzf dist/*.tar.gz -C sdist-check --strip-components=1
        cd sdist-check
        uv sync --extra cli --extra gui --extra numeric
        uv run pytest -c config/pytest.ini

  frontend:
    # The GUI has no unit tests; lint + type-check + production build catch most
    # breakage from dependency updates before they reach a release image.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type-check and build
      run: npm run build

  docker:
    # Build (without pushing) and run the image the docker workflow publishes, natively on each
    # platform it publishes, so Dockerfile and lockfile changes are tested before a release.
    name: docker (${{ matrix.platform }})
    strategy:
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-latest
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: gale-shapley-algorithm:ci
        cache-from: type=gha,scope=${{ matrix.runner }}
        cache-to: type=gha,mode=max,scope=${{ matrix.runner }}

    - name: Smoke-test the image
      run: |
        docker run -d --name app -p 8000:8000 gale-shapley-algorithm:ci
        trap 'docker logs app; docker rm -f app' EXIT
        for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
        page="$(curl -sf http://127.0.0.1:8000/)"
        grep -q '<div id="root">' <<< "$page"
        asset="$(grep -o '/assets/[^"]*\.js' <<< "$page" | head -n 1)"
        curl -sf -o /dev/null "http://127.0.0.1:8000$asset"
        curl -sf -X POST http://127.0.0.1:8000/api/matching -H 'content-type: application/json' \
          -d '{"proposer_preferences": {"a": ["b"]}, "responder_preferences": {"b": ["a"]}}' \
          | grep -q '"matches":{"a":"b"}'
