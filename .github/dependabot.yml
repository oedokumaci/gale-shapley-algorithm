version: 2
updates:
  # Python dependencies resolved by uv from pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Hold new releases for a week before proposing them (time for a compromised
    # release to be yanked). Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
      # Without this, every advisory opens its own PR.
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      # include: "scope" appends "(deps)" or "(deps-dev)" to the prefix itself.
      prefix: "build"
      include: "scope"

  # Frontend npm deps (served by the FastAPI GUI backend).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm_and_yarn:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # The frontend has no unit tests (CI only lints and builds it), so major bumps on
    # icon / type-system packages that tend to ship breaking renames or removals
    # are ignored here and should be handled via a targeted PR that reviews
    # the migration. Minor / patch updates still flow through.
    ignore:
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions, pinned by commit SHA with a version comment that Dependabot keeps in sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
